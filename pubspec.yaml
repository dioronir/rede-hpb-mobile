name: rede_hpb_lims
description: Rede HPB - Plataforma de Coleta (iFERA), Biobanco, Controle de Qualidade e Governanca (HC / HUOC / HCP).
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  webview_flutter: ^4.8.0
  webview_flutter_android: ^3.16.0
  file_picker: ^8.0.0
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: "launcher_icon"
  ios: false
  image_path: "logo_hpb.png"
  min_sdk_android: 24
  adaptive_icon_background: "#0F172A"
  adaptive_icon_foreground: "logo_hpb.jpeg"

flutter:
  uses-material-design: true
