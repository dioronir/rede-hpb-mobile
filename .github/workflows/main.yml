name: Gerar APK e AAB Oficial - Rede HPB

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: 1. Baixar Codigo do Repositorio
        uses: actions/checkout@v4

      - name: 2. Configurar Java 17 (v5)
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 3. Instalar Flutter SDK Estavel
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: 4. Desbloquear AAR Metadata do file_picker no Gradle
        run: |
          mkdir -p ~/.gradle/init.d
          cat << 'EOF' > ~/.gradle/init.d/fix_aar_metadata.gradle
          allprojects {
              tasks.whenTaskAdded { task ->
                  if (task.name.contains("AarMetadata")) {
                      task.enabled = false
                  }
              }
              afterEvaluate { project ->
                  if (project.hasProperty("android")) {
                      project.android {
                          compileSdkVersion 36
                      }
                  }
                  project.tasks.matching { it.name.contains("AarMetadata") }.configureEach {
                      enabled = false
                  }
              }
          }
          EOF

      - name: 5. Gerar Estrutura Android API 36 e Compilar APK + AAB
        run: |
          flutter create --platforms=android --org br.ufpe.redehpb --project-name rede_hpb_lims .
          sed -i 's/<application/<uses-permission android:name="android.permission.INTERNET"\/><application android:usesCleartextTraffic="true"/g' android/app/src/main/AndroidManifest.xml
          sed -i 's/android:label="rede_hpb_lims"/android:label="Rede HPB"/g' android/app/src/main/AndroidManifest.xml
          if [ -f android/app/build.gradle ]; then
            sed -i 's/compileSdk = flutter.compileSdkVersion/compileSdk = 36/g' android/app/build.gradle
            sed -i 's/compileSdkVersion flutter.compileSdkVersion/compileSdkVersion 36/g' android/app/build.gradle
            sed -i 's/targetSdk = flutter.targetSdkVersion/targetSdk = 35/g' android/app/build.gradle
          fi
          if [ -f android/app/build.gradle.kts ]; then
            sed -i 's/compileSdk = flutter.compileSdkVersion/compileSdk = 36/g' android/app/build.gradle.kts
            sed -i 's/targetSdk = flutter.targetSdkVersion/targetSdk = 35/g' android/app/build.gradle.kts
          fi
          flutter pub get
          flutter build apk --release --no-tree-shake-icons
          flutter build appbundle --release --no-tree-shake-icons

      - name: 6. Disponibilizar APK (Instalador Direto) e AAB (Google Play Store)
        uses: actions/upload-artifact@v4
        with:
          name: Instaladores-Android-RedeHPB
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/bundle/release/app-release.aab
