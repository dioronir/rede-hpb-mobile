name: Gerar APK e AAB Oficial - Rede HPB

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: 1. Baixar Codigo do Repositorio
        uses: actions/checkout@v4

      - name: 2. Configurar Java 17 (v5)
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 3. Instalar Flutter SDK Estavel
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: 4. Gerar Estrutura Android API 35, Assinar e Compilar APK + AAB
        run: |
          flutter create --platforms=android --org br.ufpe.redehpb --project-name rede_hpb_lims .
          sed -i 's/<application/<uses-permission android:name="android.permission.INTERNET"\/><application android:usesCleartextTraffic="true"/g' android/app/src/main/AndroidManifest.xml
          sed -i 's/android:label="rede_hpb_lims"/android:label="Rede HPB"/g' android/app/src/main/AndroidManifest.xml
          flutter pub get
          flutter build apk --release
          flutter build appbundle --release

      - name: 5. Disponibilizar APK (Instalador Direto) e AAB (Google Play Store)
        uses: actions/upload-artifact@v4
        with:
          name: Instaladores-Android-RedeHPB
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/bundle/release/app-release.aab
