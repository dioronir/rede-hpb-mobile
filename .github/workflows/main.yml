name: Gerar APK e AAB Oficial - Rede HPB

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: 1. Baixar Codigo do Repositorio
        uses: actions/checkout@v4

      - name: 2. Configurar Java 17 (v5)
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 3. Instalar Flutter SDK 3.24.5 (Compativel com file_picker e webview_flutter)
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'

      - name: 4. Gerar Estrutura Android API 35 e Compilar APK + AAB
        run: |
          rm -rf ~/.gradle/init.d/fix_aar_metadata.gradle
          flutter create --platforms=android --org br.ufpe.redehpb --project-name rede_hpb_lims .
          sed -i 's/<application/<uses-permission android:name="android.permission.INTERNET"\/><application android:usesCleartextTraffic="true"/g' android/app/src/main/AndroidManifest.xml
          sed -i 's/android:label="rede_hpb_lims"/android:label="Rede HPB"/g' android/app/src/main/AndroidManifest.xml
          cat << 'EOF' > android/app/build.gradle
          plugins {
              id "com.android.application"
              id "kotlin-android"
              id "dev.flutter.flutter-gradle-plugin"
          }

          android {
              namespace = "br.ufpe.redehpb.rede_hpb_lims"
              compileSdk = 35

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = "17"
              }

              defaultConfig {
                  applicationId = "br.ufpe.redehpb.rede_hpb_lims"
                  minSdk = 24
                  targetSdk = 35
                  versionCode = 1
                  versionName = "1.0.0"
              }

              lint {
                  checkReleaseBuilds = false
                  abortOnError = false
              }

              buildTypes {
                  release {
                      signingConfig = signingConfigs.getByName("debug")
                      minifyEnabled = false
                      shrinkResources = false
                  }
              }
          }

          flutter {
              source = "../.."
          }
          EOF
          rm -f android/app/build.gradle.kts
          flutter pub get
          flutter build apk --release --no-tree-shake-icons
          flutter build appbundle --release --no-tree-shake-icons

      - name: 5. Disponibilizar APK (Instalador Direto) e AAB (Google Play Store)
        uses: actions/upload-artifact@v4
        with:
          name: Instaladores-Android-RedeHPB
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/bundle/release/app-release.aab
